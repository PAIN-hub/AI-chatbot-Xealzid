<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{% block title %}Xealzid - Cyber-Minimal Code Architect{% endblock %}</title>
    <!-- Modern Typography: Orbitron for futuristic headers, Inter for UI, Fira Code for editor -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
    
    <!-- Local Vendor Assets -->
    <link rel="stylesheet" href="/static/vendor/prism.css">
    
    <!-- Main Style Theme -->
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="app-wrapper">
        {% block content %}{% endblock %}
    </div>

    <!-- Local Vendor Scripts -->
    <script src="/static/vendor/dompurify.min.js"></script>
    <script src="/static/vendor/prism.js"></script>
    
    <!-- Core Application Logic -->
    <script src="/static/js/app.js"></script>
</body>
</html>
